<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self'; connect-src 'self' https://*.supabase.co https://cdn.jsdelivr.net; img-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'self'">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0f141d">
<link rel="icon" href="../../favicon.ico">
<title>Admin · Smartphone Empire</title>
<link rel="stylesheet" href="../assets/admin.css">
</head>
<body>
<header>
  <div class="brand"><b>Smartphone Empire</b><small id="who"></small></div>
  <button class="btn" id="logout">Keluar</button>
</header>
<nav class="tabs" aria-label="Menu admin">
  <button class="on" data-tab="home">Ringkasan</button>
  <button data-tab="orders">Pesanan</button>
  <button data-tab="players">Pemain</button>
  <button data-tab="sil">Ledger SIL</button>
  <button data-tab="audit">Audit</button>
  <button data-tab="system">Sistem</button>
</nav>
<main id="main"><p class="muted">Memuat…</p></main>
<dialog id="pdlg" class="wide">
  <div class="dhead"><div><h3 id="pd-title">Pemain</h3><p class="muted" id="pd-sub"></p></div>
    <button class="btn" id="pd-close" type="button" aria-label="Tutup">Tutup</button></div>
  <div class="chips sub" id="pd-tabs">
    <button class="btn on" data-pt="info">Ringkasan</button>
    <button class="btn" data-pt="wallet">Dompet SIL</button>
    <button class="btn" data-pt="save">Save game</button>
    <button class="btn" data-pt="orders">Pesanan</button>
    <button class="btn" data-pt="actions">Aksi</button>
  </div>
  <div id="pd-body"><p class="muted">Memuat…</p></div>
</dialog>
<script type="module" src="../assets/dashboard.js"></script>
</body>
</html>
