<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Welcome to Smartphone Empire</title>
    <style>
        :root {
            --bg-color: #fbfbfd; /* Apple Off-White */
            --card-bg: rgba(255, 255, 255, 0.65);
            --text-main: #1d1d1f;
            --text-sub: #86868b;
            --accent: #0071e3;
            --accent-hover: #0077ed;
            --success: #34c759;
            --font-stack: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: var(--font-stack);
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* Animasi Latar Belakang (Mesh Gradient) */
        .bg-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            z-index: 0;
            animation: float 10s infinite ease-in-out alternate;
        }
        .orb-1 {
            width: 400px; height: 400px;
            background: rgba(0, 113, 227, 0.15);
            top: -10%; left: -10%;
        }
        .orb-2 {
            width: 300px; height: 300px;
            background: rgba(52, 199, 89, 0.15);
            bottom: -10%; right: -10%;
            animation-delay: -5s;
        }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(30px, 50px) scale(1.1); }
        }

        /* Kartu Utama (Glassmorphism) */
        .card {
            position: relative;
            z-index: 1;
            background: var(--card-bg);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: 24px;
            padding: 48px 32px;
            width: 90%;
            max-width: 480px;
            text-align: center;
            box-shadow: 0 24px 48px rgba(0, 0, 0, 0.04), 0 4px 12px rgba(0, 0, 0, 0.02);
            opacity: 0;
            transform: translateY(20px) scale(0.95);
            animation: cardEnter 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes cardEnter {
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* Ikon Centang SVG */
        .icon-wrapper {
            width: 80px; height: 80px;
            background: rgba(52, 199, 89, 0.1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
            position: relative;
        }
        
        .icon-wrapper::after {
            content: '';
            position: absolute;
            width: 100%; height: 100%;
            border-radius: 50%;
            border: 2px solid var(--success);
            opacity: 0.3;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.5; }
            100% { transform: scale(1.5); opacity: 0; }
        }

        .checkmark {
            width: 40px; height: 40px;
            border-radius: 50%;
            display: block;
            stroke-width: 3;
            stroke: var(--success);
            stroke-miterlimit: 10;
            animation: fill .4s ease-in-out .4s forwards, scale .3s ease-in-out .9s both;
        }

        .checkmark-circle {
            stroke-dasharray: 166;
            stroke-dashoffset: 166;
            stroke-width: 3;
            stroke-miterlimit: 10;
            stroke: var(--success);
            fill: none;
            animation: stroke 0.6s cubic-bezier(0.65, 0, 0.45, 1) forwards;
        }

        .checkmark-check {
            transform-origin: 50% 50%;
            stroke-dasharray: 48;
            stroke-dashoffset: 48;
            animation: stroke 0.3s cubic-bezier(0.65, 0, 0.45, 1) 0.8s forwards;
        }

        @keyframes stroke { 100% { stroke-dashoffset: 0; } }
        @keyframes scale { 0%, 100% { transform: none; } 50% { transform: scale3d(1.1, 1.1, 1); } }

        /* Teks */
        h1 {
            font-size: clamp(2rem, 5vw, 2.5rem);
            font-weight: 700;
            letter-spacing: -0.04em;
            margin: 0 0 12px 0;
            background: linear-gradient(135deg, #1d1d1f 0%, #434344 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            font-size: 1.05rem;
            color: var(--text-sub);
            line-height: 1.5;
            margin: 0 0 32px 0;
            font-weight: 400;
            letter-spacing: -0.01em;
        }

        /* Tombol */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background-color: var(--accent);
            color: #ffffff;
            padding: 16px 32px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 600;
            font-size: 1rem;
            letter-spacing: -0.01em;
            transition: all 0.2s cubic-bezier(0.25, 1, 0.5, 1);
            width: 100%;
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(0, 113, 227, 0.3);
        }

        .btn:hover {
            background-color: var(--accent-hover);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 113, 227, 0.4);
        }

        .btn:active {
            transform: translateY(0) scale(0.98);
        }

        /* Timer */
        .timer-text {
            margin-top: 24px;
            font-size: 0.85rem;
            color: var(--text-sub);
            font-weight: 500;
            font-variant-numeric: tabular-nums;
        }
    </style>
</head>
<body>
    <!-- Efek Latar Belakang -->
    <div class="bg-orb orb-1"></div>
    <div class="bg-orb orb-2"></div>

    <!-- Kartu Utama -->
    <div class="card">
        <div class="icon-wrapper">
            <svg class="checkmark" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 52 52">
                <circle class="checkmark-circle" cx="26" cy="26" r="25" fill="none"/>
                <path class="checkmark-check" fill="none" d="M14.1 27.2l7.1 7.2 16.7-16.8"/>
            </svg>
        </div>
        
        <h1>Welcome Aboard.</h1>
        <p>Akun kamu berhasil dibuat. Bersiaplah untuk membangun kerajaan teknologi duniamu.</p>
        
        <a href="/" class="btn">Mulai Bermain Sekarang</a>
        
        <div class="timer-text">
            Mengarahkan ke game dalam <span id="countdown">4</span> detik...
        </div>
    </div>

    <script>
        // Logika Hitung Mundur (Countdown) & Redirect
        let timeLeft = 4;
        const countdownEl = document.getElementById('countdown');
        
        const timer = setInterval(() => {
            timeLeft--;
            countdownEl.textContent = timeLeft;
            
            if (timeLeft <= 0) {
                clearInterval(timer);
                window.location.href = '/';
            }
        }, 1000);

        // Opsional: Simpan konversi (bisa dipanggil jika ada script Google Ads di sini)
        // gtag_report_conversion('https://www.smartphone-empire.my.id/thank-you.html');
    </script>
</body>
</html>
