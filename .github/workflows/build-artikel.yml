name: Bangun halaman artikel
on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'   # tiap jam
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node tools/build-artikel.mjs
      - name: Commit bila ada perubahan
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add -A a k sitemap.xml robots.txt index.html
          git diff --cached --quiet || (git commit -m "bangun halaman artikel" && git push)
