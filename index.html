<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Smartphone Empire</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #121212; color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden; width: 100vw; height: 100vh;
            display: flex; flex-direction: column;
        }
        
        /* Layout Mobile (Default) */
        #app-header { height: 60px; background: #1e1e1e; border-bottom: 1px solid #333; flex-shrink: 0; }
        #main-wrapper { flex-grow: 1; display: flex; overflow: hidden; }
        #sidebar { display: none; width: 250px; background: #181818; border-right: 1px solid #333; flex-shrink: 0; flex-direction: column; }
        #app-view { flex-grow: 1; overflow-y: auto; padding: 20px; background: #121212; }
        #mobile-nav { height: 60px; background: #1e1e1e; border-top: 1px solid #333; flex-shrink: 0; }

        /* Layout Desktop (Layar Lebar) */
        @media (min-width: 768px) {
            #sidebar { display: flex; }
            #mobile-nav { display: none; }
        }

        /* Layar Loading & Error */
        #loading-screen {
            position: absolute; z-index: 9999; top: 50%; left: 50%;
            transform: translate(-50%, -50%); text-align: center;
            font-size: 16px; color: #aaaaaa; animation: pulse 1.5s infinite;
            background: rgba(18, 18, 18, 0.9); padding: 20px; border-radius: 8px;
        }
        #error-message {
            position: absolute; z-index: 10000; top: 10px; left: 10px; right: 10px;
            background: #ff3333; color: white; padding: 15px; border-radius: 5px;
            display: none; word-wrap: break-word; font-size: 14px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        @keyframes pulse { 0% { opacity: 0.6; } 50% { opacity: 1; } 100% { opacity: 0.6; } }
    </style>
</head>
<body>

    <header id="app-header"></header>
    
    <div id="main-wrapper">
        <aside id="sidebar"></aside>
        <main id="app-view"></main>
    </div>
    
    <nav id="mobile-nav"></nav>

    <div id="loading-screen">Memuat Smartphone Empire...</div>
    <div id="error-message"></div>

    <script type="module" src="./src/main.js" id="main-script"></script>

    <!-- Script Pendeteksi Error -->
    <script>
        window.addEventListener('error', function(e) {
            if (e.target && e.target.tagName === 'SCRIPT') {
                const errorDiv = document.getElementById('error-message');
                const loadingDiv = document.getElementById('loading-screen');
                if (loadingDiv) loadingDiv.style.display = 'none';
                if (errorDiv) {
                    errorDiv.style.display = 'block';
                    errorDiv.innerHTML = "<strong>❌ GAGAL MEMUAT SCRIPT</strong><br><br>" +
                                         "File yang dicari:<br>" + (e.target.src || 'Unknown') + "<br><br>" +
                                         "<b>Periksa kembali nama file dan huruf besar/kecilnya.</b>";
                }
            }
        }, true); 
    </script>

</body>
</html>
