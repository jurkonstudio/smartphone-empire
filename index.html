<!-- ============================================================
     ERUDA SECRET TAP (DINAMIS + KEAMANAN EMAIL)
     ============================================================ -->
<script>
    (function() {
        var tapCount = 0;
        var tapTimer;
        var ADMIN_EMAIL = 'jurkon@yahoo.com'; // GANTI DENGAN EMAIL ADMINMU

        document.addEventListener('click', function(e) {
            // Hanya deteksi ketukan di pojok kiri atas (area header)
            if (e.clientY < 100 && e.clientX < 200) {
                tapCount++;
                
                clearTimeout(tapTimer);
                tapTimer = setTimeout(function() { tapCount = 0; }, 1000);

                if (tapCount >= 5) {
                    tapCount = 0;
                    
                    // 1. Cek apakah yang login adalah Admin
                    var currentEmail = '';
                    try {
                        // Ambil email dari localStorage (disimpan oleh CloudSync saat login)
                        var cloudEmail = localStorage.getItem('smartphone-empire:admin-email');
                        if (cloudEmail) currentEmail = cloudEmail.toLowerCase();
                    } catch(err) {}

                    if (currentEmail !== ADMIN_EMAIL.toLowerCase()) {
                        // JIKA BUKAN ADMIN: Tampilkan pesan error dan jangan buka Eruda
                        var toast = document.createElement('div');
                        toast.textContent = '⚠️ Akses Ditolak: Fitur ini khusus Admin.';
                        toast.style.cssText = 'position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#d32f2f;color:#fff;padding:8px 16px;border-radius:20px;font-size:12px;z-index:999999;';
                        document.body.appendChild(toast);
                        setTimeout(function() { toast.remove(); }, 3000);
                        return;
                    }

                    // 2. JIKA ADMIN: Muat Eruda secara Dinamis
                    if (typeof eruda === 'undefined') {
                        var script = document.createElement('script');
                        script.src = 'https://cdn.jsdelivr.net/npm/eruda';
                        script.onload = function() {
                            eruda.init();
                            eruda.show();
                            _showAdminToast();
                        };
                        document.head.appendChild(script);
                    } else {
                        eruda.show();
                        _showAdminToast();
                    }
                }
            }
        });

        function _showAdminToast() {
            var toast = document.createElement('div');
            toast.textContent = '🛠️ Debug Mode Aktif (Admin)';
            toast.style.cssText = 'position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:8px 16px;border-radius:20px;font-size:12px;z-index:999999;';
            document.body.appendChild(toast);
            setTimeout(function() { toast.remove(); }, 3000);
        }
    })();
</script>

<!-- ============================================================
     VERSION CHECK
     ============================================================ -->
<script>
(function () {
    try {
        var KEY = 'se_deploy_v';
        var url = new URL(window.location.href);
        var incoming = url.searchParams.get('_v');
        var stored = localStorage.getItem(KEY);

        if (incoming) {
            try { localStorage.setItem(KEY, incoming); } catch (e) {}
            url.searchParams.delete('_v');
            try { history.replaceState(null, '', url.toString()); } catch (e) {}
            return;
        }

        fetch('./version.json?t=' + Date.now(), { cache: 'no-store' })
            .then(function (r) { return r.json(); })
            .then(function (data) {
                var v = data && data.v;
                if (!v) return;
                if (stored && stored !== v) {
                    url.searchParams.set('_v', v);
                    window.location.replace(url.toString());
                } else if (!stored) {
                    try { localStorage.setItem(KEY, v); } catch (e) {}
                }
            })
            .catch(function () { });
    } catch (e) { }
})();
</script>

<!-- ============================================================
     GLOBAL ERROR OVERLAY
     ============================================================ -->
<script>
window.addEventListener('error', function (e) {
    var msg = 'GLOBAL ERROR\n\n';
    msg += 'Message: ' + (e.message || (e.error && e.error.message) || 'unknown') + '\n';
    msg += 'File: ' + (e.filename || '-') + '\n';
    msg += 'Line: ' + (e.lineno || '-') + ':' + (e.colno || '-') + '\n\n';
    msg += 'Stack:\n' + ((e.error && e.error.stack) ? e.error.stack : '-');
    var box = document.createElement('pre');
    box.style.cssText = 'position:fixed;inset:0;background:#000;color:#f44;font:12px monospace;padding:20px;padding-top:80px;overflow:auto;z-index:999999;white-space:pre-wrap;word-break:break-word;margin:0;';
    box.textContent = msg;
    if (document.body) document.body.appendChild(box);
    else document.addEventListener('DOMContentLoaded', function () { document.body.appendChild(box); });
});
window.addEventListener('unhandledrejection', function (e) {
    var msg = 'PROMISE REJECTED\n\nReason: ' +
        ((e.reason && e.reason.message) ? e.reason.message : e.reason) + '\n\nStack:\n' +
        ((e.reason && e.reason.stack) ? e.reason.stack : '-');
    var box = document.createElement('pre');
    box.style.cssText = 'position:fixed;inset:0;background:#000;color:#fa0;font:12px monospace;padding:20px;padding-top:80px;overflow:auto;z-index:999999;white-space:pre-wrap;word-break:break-word;margin:0;';
    box.textContent = msg;
    if (document.body) document.body.appendChild(box);
});
</script>

    <div id="toast-container" class="toast-container" aria-live="polite"></div>
    <div id="loading-screen" class="loading-screen" role="progressbar" aria-label="Memuat Smartphone Empire" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <div class="ls-stage">
            <img class="ls-art" src="./assets/img/loading-screen.jpg" alt="Smartphone Empire by Jurkon Studio" decoding="async" draggable="false">
            <div class="ls-meter">
                <div class="ls-track"><div class="ls-fill" id="ls-fill"></div></div>
                <span class="ls-pct" id="ls-pct">0%</span>
            </div>
        </div>
    </div>
    <script>
    /* Loading screen: persen = progres nyata (modul JS yang sudah terunduh + tahap boot di main.js). */
    window.__splash = (function () {
        var el = document.getElementById('loading-screen');
        var fill = document.getElementById('ls-fill');
        var pct = document.getElementById('ls-pct');
        var meta = document.querySelector('meta[name="theme-color"]');
        var origTheme = meta ? meta.getAttribute('content') : null;
        var TOTAL_MODULES = 190;   // jumlah modul statis dari main.js; hanya untuk estimasi, aman bila meleset
        var MODULE_CAP = 70;       // unduhan modul mengisi sampai 70%, sisanya dari tahap boot
        var target = 2, shown = 0, finished = false, raf = 0, closed = false, seen = {};
        if (meta) meta.setAttribute('content', '#fafafa');

        function paint(v) {
            var n = Math.min(100, Math.round(v));
            fill.style.width = v.toFixed(1) + '%';
            pct.textContent = n + '%';
            el.setAttribute('aria-valuenow', String(n));
        }
        function close() {
            if (closed) return; closed = true;
            el.classList.add('ls-done');
            if (meta && origTheme) meta.setAttribute('content', origTheme);
            setTimeout(function () { el.style.display = 'none'; }, 450);
        }
        function tick() {
            raf = 0;
            var diff = target - shown;
            if (diff > 0.05) shown += Math.max(diff * 0.14, 0.25); else shown = target;
            if (shown > target) shown = target;
            paint(shown);
            if (shown < target) { raf = requestAnimationFrame(tick); return; }
            if (finished && shown >= 100) setTimeout(close, 220);
        }
        function kick() { if (!raf) raf = requestAnimationFrame(tick); }
        function set(p) { if (!finished && p > target) { target = Math.min(99, p); kick(); } }

        function countModules() {
            try {
                var list = performance.getEntriesByType('resource'), n = 0;
                for (var i = 0; i < list.length; i++) {
                    var u = list[i].name;
                    if (u.indexOf('/src/') > -1 && /\.js(\?|$)/.test(u) && !seen[u]) { seen[u] = 1; }
                }
                for (var k in seen) n++;
                set(4 + (MODULE_CAP - 4) * Math.min(1, n / TOTAL_MODULES));
            } catch (e) {}
        }
        try {
            countModules();
            new PerformanceObserver(countModules).observe({ type: 'resource', buffered: true });
        } catch (e) { /* tanpa PerformanceObserver: persen naik lewat tahap boot */ }

        return {
            set: set,
            finish: function () { if (finished) return; finished = true; target = 100; kick(); },
        };
    })();
    </script>
    <div id="error-message" class="error-message" role="alert"></div>

    <script type="module" src="./src/main.js"></script>

    <script>
    window.addEventListener('error', function (e) {
        if (e.target && e.target.tagName === 'SCRIPT') {
            var ld = document.getElementById('loading-screen');
            var er = document.getElementById('error-message');
            if (ld) ld.style.display = 'none';
            if (er) {
                er.style.display = 'block';
                er.textContent = 'Gagal memuat: ' + (e.target.src || 'unknown');
            }
        }
    }, true);
    </script>
