<!-- FILE: index.html -->
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0f0f0f">
<title>Smartphone Empire</title>
    <link rel="modulepreload" href="./src/data/components.data.js">
<link rel="modulepreload" href="./src/systems/ProductSystem.js">
<link rel="modulepreload" href="./src/systems/MarketSystem.js">
<link rel="modulepreload" href="./src/ui/panels/ProductPanel.js">
    <link rel="modulepreload" href="./src/core/GameState.js">
<link rel="modulepreload" href="./src/systems/ResearchSystem.js">
<link rel="modulepreload" href="./src/systems/OSSystem.js">
<link rel="stylesheet" href="./style.css">
</head>
<body>
    <div id="app">
        <header id="app-header" class="app-header"></header>
        <main id="app-view" class="app-view" role="main"></main>
        <nav id="mobile-nav" class="mobile-nav" aria-label="Navigasi utama"></nav>
        <aside id="sidebar" aria-hidden="true"></aside>
    </div>

    <div id="toast-container" class="toast-container" aria-live="polite"></div>
    <div id="loading-screen" class="loading-screen">Memuat Smartphone Empire…</div>
    <div id="error-message" class="error-message" role="alert"></div>

    <script type="module" src="./src/main.js?v=2"></script>
    <script>
        // Fallback: tampilkan pesan jika modul gagal dimuat (404 / sintaks)
        window.addEventListener('error', function (e) {
            if (e.target && e.target.tagName === 'SCRIPT') {
                var ld = document.getElementById('loading-screen');
                var er = document.getElementById('error-message');
                if (ld) ld.style.display = 'none';
                if (er) {
                    er.style.display = 'block';
                    er.textContent = 'Gagal memuat: ' + (e.target.src || 'unknown');
                }
            }
        }, true);
    </script>
</body>
</html>
