<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Smartphone Empire</title>
    <style>
        /* Reset dasar & Tema Gelap */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            background-color: #1a1a1a; /* Latar belakang gelap */
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden; /* Mencegah scroll yang tidak perlu */
            width: 100vw;
            height: 100vh;
        }

        /* Wadah utama aplikasi */
        #app {
            width: 100%;
            height: 100%;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Layar loading sementara */
        #loading-screen {
            text-align: center;
            font-size: 16px;
            color: #aaaaaa;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 0.6; }
            50% { opacity: 1; }
            100% { opacity: 0.6; }
        }
    </style>
</head>
<body>

    <!-- Wadah utama tempat game/aplikasi akan dirender -->
    <div id="app">
        <div id="loading-screen">Memuat Smartphone Empire...</div>
    </div>

    <!-- 
        PENTING: Perhatikan penggunaan "./" di depan "src/main.js".
        Ini memastikan browser mencari file di dalam folder proyek Anda 
        (smartphone-empire/src/main.js), bukan di root domain.
        
        Jika file main.js Anda berada langsung di folder utama (bukan di dalam folder src),
        ubah menjadi: src="./main.js"
    -->
    <script type="module" src="./src/main.js"></script>

</body>
</html>
