<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Smartphone Empire</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            background-color: #1a1a1a;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Wadah Game */
        #game-container {
            width: 100%;
            height: 100%;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Elemen Canvas untuk Game (jika dibutuhkan) */
        canvas {
            display: block;
            max-width: 100%;
            max-height: 100%;
            background-color: #000; /* Warna dasar canvas */
        }

        /* Layar Loading */
        #loading-screen {
            position: absolute;
            z-index: 10;
            text-align: center;
            font-size: 16px;
            color: #aaaaaa;
            animation: pulse 1.5s infinite;
        }

        /* Pesan Error (Jika script gagal) */
        #error-message {
            position: absolute;
            z-index: 20;
            color: #ff5555;
            background: rgba(0,0,0,0.8);
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            display: none; /* Sembunyikan secara default */
            max-width: 90%;
            word-wrap: break-word;
        }

        @keyframes pulse {
            0% { opacity: 0.6; }
            50% { opacity: 1; }
            100% { opacity: 0.6; }
        }
    </style>
</head>
<body>

    <div id="game-container">
        <!-- Layar Loading akan hilang jika script berhasil -->
        <div id="loading-screen">Memuat Smartphone Empire...</div>
        
        <!-- Pesan error akan muncul jika script gagal dimuat -->
        <div id="error-message"></div>

        <!-- 
            Elemen Canvas: Banyak game HTML5 membutuhkan ini.
            Jika main.js Anda menggunakan canvas, pastikan ID-nya sesuai.
            Jika tidak, Anda bisa menghapusnya.
        -->
        <canvas id="gameCanvas"></canvas>
    </div>

    <!-- Script Utama -->
    <script type="module" src="./src/main.js"></script>

    <!-- Script Fallback untuk menangkap error jika main.js gagal dimuat -->
    <script>
        window.addEventListener('error', function(e) {
            // Jika error terjadi saat memuat script
            if (e.target && e.target.tagName === 'SCRIPT') {
                const errorDiv = document.getElementById('error-message');
                const loadingDiv = document.getElementById('loading-screen');
                if (loadingDiv) loadingDiv.style.display = 'none';
                if (errorDiv) {
                    errorDiv.style.display = 'block';
                    errorDiv.innerHTML = "<strong>Gagal memuat script:</strong><br>" + (e.target.src || 'Unknown source') + "<br><br>Cek Console (F12) untuk detail error.";
                }
            }
        }, true);
    </script>

</body>
</html>
