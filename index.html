<!-- ============================================================
     ERUDA SECRET TAP
     Eruda akan dimuat, tapi tombolnya disembunyikan.
     Ketuk pojok kiri atas layar sebanyak 5x dengan cepat untuk membuka.
     ============================================================ -->
<script src="https://cdn.jsdelivr.net/npm/eruda"></script>
<script>
    (function() {
        // Inisialisasi Eruda di latar belakang
        eruda.init();
        
        // Sembunyikan tombol Eruda secara default
        eruda.hide(); 

        var tapCount = 0;
        var tapTimer;

        // Deteksi ketukan di pojok kiri atas (area logo)
        document.addEventListener('click', function(e) {
            // Cek apakah yang diketuk adalah area header bagian kiri (logo/nama perusahaan)
            // atau kita bisa mendeteksi ketukan di mana saja pada 100px pertama dari atas
            if (e.clientY < 100 && e.clientX < 200) {
                tapCount++;
                
                // Reset hitungan jika jeda antar ketukan lebih dari 1 detik
                clearTimeout(tapTimer);
                tapTimer = setTimeout(function() {
                    tapCount = 0;
                }, 1000);

                // Jika mencapai 5 ketukan
                if (tapCount >= 5) {
                    eruda.show();
                    tapCount = 0;
                    // Tampilkan notifikasi kecil bahwa debug mode aktif
                    var toast = document.createElement('div');
                    toast.textContent = '🛠️ Debug Mode Aktif';
                    toast.style.cssText = 'position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:8px 16px;border-radius:20px;font-size:12px;z-index:999999;';
                    document.body.appendChild(toast);
                    setTimeout(function() { toast.remove(); }, 3000);
                }
            }
        });
    })();
</script>

<!-- ============================================================
     VERSION CHECK — paksa reload kalau versi deploy berubah.
     ============================================================ -->
<script>
(function () {
    try {
        var KEY = 'se_deploy_v';
        var url = new URL(window.location.href);
        var incoming = url.searchParams.get('_v');
        var stored = localStorage.getItem(KEY);

        if (incoming) {
            try { localStorage.setItem(KEY, incoming); } catch (e) {}
            url.searchParams.delete('_v');
            try { history.replaceState(null, '', url.toString()); } catch (e) {}
            return;
        }

        fetch('./version.json?t=' + Date.now(), { cache: 'no-store' })
            .then(function (r) { return r.json(); })
            .then(function (data) {
                var v = data && data.v;
                if (!v) return;
                if (stored && stored !== v) {
                    url.searchParams.set('_v', v);
                    window.location.replace(url.toString());
                } else if (!stored) {
                    try { localStorage.setItem(KEY, v); } catch (e) {}
                }
            })
            .catch(function () { });
    } catch (e) { }
})();
</script>

<!-- ============================================================
     GLOBAL ERROR OVERLAY
     ============================================================ -->
<script>
window.addEventListener('error', function (e) {
    var msg = 'GLOBAL ERROR\n\n';
    msg += 'Message: ' + (e.message || (e.error && e.error.message) || 'unknown') + '\n';
    msg += 'File: ' + (e.filename || '-') + '\n';
    msg += 'Line: ' + (e.lineno || '-') + ':' + (e.colno || '-') + '\n\n';
    msg += 'Stack:\n' + ((e.error && e.error.stack) ? e.error.stack : '-');
    var box = document.createElement('pre');
    box.style.cssText = 'position:fixed;inset:0;background:#000;color:#f44;font:12px monospace;padding:20px;padding-top:80px;overflow:auto;z-index:999999;white-space:pre-wrap;word-break:break-word;margin:0;';
    box.textContent = msg;
    if (document.body) document.body.appendChild(box);
    else document.addEventListener('DOMContentLoaded', function () { document.body.appendChild(box); });
});
window.addEventListener('unhandledrejection', function (e) {
    var msg = 'PROMISE REJECTED\n\nReason: ' +
        ((e.reason && e.reason.message) ? e.reason.message : e.reason) + '\n\nStack:\n' +
        ((e.reason && e.reason.stack) ? e.reason.stack : '-');
    var box = document.createElement('pre');
    box.style.cssText = 'position:fixed;inset:0;background:#000;color:#fa0;font:12px monospace;padding:20px;padding-top:80px;overflow:auto;z-index:999999;white-space:pre-wrap;word-break:break-word;margin:0;';
    box.textContent = msg;
    if (document.body) document.body.appendChild(box);
});
</script>

    <script>
    window.addEventListener('error', function (e) {
        if (e.target && e.target.tagName === 'SCRIPT') {
            var ld = document.getElementById('loading-screen');
            var er = document.getElementById('error-message');
            if (ld) ld.style.display = 'none';
            if (er) {
                er.style.display = 'block';
                er.textContent = 'Gagal memuat: ' + (e.target.src || 'unknown');
            }
        }
    }, true);
