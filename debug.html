<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Debug — Smartphone Empire</title>
<style>
body { font-family: monospace; background: #000; color: #0f0; padding: 12px; font-size: 13px; line-height: 1.5; margin: 0; }
h1 { color: #fff; font-size: 16px; margin: 0 0 8px; }
h2 { color: #fff; font-size: 14px; margin: 16px 0 6px; }
.ok { color: #0f0; }
.fail { color: #f44; }
.warn { color: #fa0; }
.row { padding: 4px 8px; border-bottom: 1px solid #222; word-break: break-all; }
.summary { padding: 10px; background: #111; border-radius: 6px; margin-bottom: 12px; }
</style>
</head>
<body>
<h1>Debug — Smartphone Empire</h1>
<div id="summary" class="summary">Memeriksa...</div>
<div id="out"></div>

<script type="module">
const files = [
    './src/core/EventBus.js',
    './src/core/GameState.js',
    './src/core/TimeSystem.js',
    './src/core/SaveService.js',
    './src/core/ToastService.js',
    './src/core/ThemeService.js',
    './src/core/SwipeService.js',
    './src/core/NavSliderDrag.js',
    './src/core/DesignEraService.js',
    './src/config/app.config.js',
    './src/config/constants.js',
    './src/config/time.config.js',
    './src/data/balance.data.js',
    './src/data/os.data.js',
    './src/data/research.data.js',
    './src/data/components.data.js',
    './src/data/era-design.data.js',
    './src/data/historical-timeline.data.js',
    './src/data/phone-specs.data.js',
    './src/data/marketing.data.js',
    './src/data/feedback.data.js',
    './src/data/staff.data.js',
    './src/data/competitors.data.js',
    './src/data/news.data.js',
    './src/data/chip-features.data.js',
    './src/data/chip-architecture.data.js',
    './src/data/chip-node.data.js',
    './src/data/chip-research.data.js',
    './src/systems/OSSystem.js',
    './src/systems/ResearchSystem.js',
    './src/systems/ProductSystem.js',
    './src/systems/EconomySystem.js',
    './src/systems/MarketSystem.js',
    './src/systems/CompetitorSystem.js',
    './src/systems/PublicOpinionSystem.js',
    './src/systems/EraSystem.js',
    './src/systems/TeamSystem.js',
    './src/systems/ChipSystem.js',
    './src/systems/FabSystem.js',
    './src/systems/NewsSystem.js',
    './src/systems/QuestSystem.js',
    './src/systems/TutorialSystem.js',
    './src/ui/layout/Header.js',
    './src/ui/layout/MobileNav.js',
    './src/ui/modal.js',
    './src/ui/icons/FeatureIcons.js',
    './src/ui/icons/NavIcons.js',
    './src/ui/icons.js',
    './src/ui/phone/PhoneMockup.js',
    './src/ui/phone/OsScreenMockup.js',
    './src/ui/phone/ChipMockup.js',
    './src/ui/charts/ChipRadarChart.js',
    './src/ui/panels/DashboardPanel.js',
    './src/ui/panels/ResearchPanel.js',
    './src/ui/panels/OSPanel.js',
    './src/ui/panels/TimelinePanel.js',
    './src/ui/panels/OsStatBar.js',
    './src/ui/panels/ProductPanel.js',
    './src/ui/panels/MarketPanel.js',
    './src/ui/panels/TeamPanel.js',
    './src/ui/panels/DesignWizard.js',
    './src/ui/panels/ChipDesignerPanel.js',
    './src/ui/panels/FabPanel.js',
    './src/ui/panels/SettingsPanel.js',
    './src/ui/panels/GuidePanel.js',
    './src/ui/panels/EmptyState.js',
    './src/ui/panels/CompanyProfilePanel.js',
    './src/ui/panels/StaffDetailModal.js',
    './src/ui/panels/CompetitorDetailModal.js',
    './src/ui/panels/PublicOpinionPanel.js',
    './src/ui/panels/NewsListPanel.js',
    './src/ui/panels/NewsArticleModal.js',
    './src/ui/panels/ToastContainer.js',
    './src/ui/panels/OnboardingModal.js',
    './src/ui/panels/TutorialOverlay.js',
    './src/ui/panels/MonthlySummaryModal.js',
    './src/ui/panels/GameOverScreen.js',
    './src/ui/panels/CashChart.js',
    './src/ui/panels/SalesChart.js',
    './src/ui/notifications/NotificationRenderer.js',
    './src/main.js'
];

const summaryEl = document.getElementById('summary');
const out = document.getElementById('out');
out.innerHTML = '';

let ok = 0, fail = 0;
const fails = [];

for (const f of files) {
    try {
        await import(f);
        out.innerHTML += '<div class="row ok">✓ ' + f + '</div>';
        ok++;
    } catch (e) {
        const msg = (e && e.message) ? e.message : String(e);
        out.innerHTML += '<div class="row fail">✗ ' + f + '<br>&nbsp;&nbsp;&nbsp;&nbsp;<span class="warn">' + msg + '</span></div>';
        fail++;
        fails.push({ file: f, msg: msg });
    }
    summaryEl.textContent = 'Progress: ' + (ok + fail) + '/' + files.length + ' | OK: ' + ok + ' | FAIL: ' + fail;
}

summaryEl.innerHTML = '<b>Selesai.</b> OK: <span class="ok">' + ok + '</span> | FAIL: <span class="fail">' + fail + '</span> | Total: ' + files.length;

if (fails.length > 0) {
    out.innerHTML += '<h2>Ringkasan kegagalan</h2>';
    fails.forEach(function (x) {
        out.innerHTML += '<div class="row fail">' + x.file + '<br><span class="warn">' + x.msg + '</span></div>';
    });
}
</script>
</body>
</html>
