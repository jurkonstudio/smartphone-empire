<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Debug</title>
<style>
body{font-family:monospace;font-size:12px;background:#111;color:#eee;padding:10px;line-height:1.5;word-break:break-all;}
.ok{color:#4CAF50;}
.bad{color:#f44336;font-weight:700;}
</style>
</head>
<body>
<pre id="out">Loading...</pre>
<script type="module">
const out = document.getElementById('out');
const files = [
    'src/data/competitors.data.js',
    'src/data/competitors/helpers.js',
    'src/data/competitors/index.js',
    'src/data/competitors/nokia.js',
    'src/data/competitors/motorola.js',
    'src/data/competitors/sony_ericsson.js',
    'src/data/competitors/siemens.js',
    'src/data/competitors/palm.js',
    'src/data/competitors/blackberry.js',
    'src/data/competitors/samsung.js',
    'src/data/competitors/lg.js',
    'src/data/competitors/htc.js',
    'src/data/competitors/apple.js',
    'src/data/competitors/google_android.js',
    'src/data/competitors/huawei.js',
    'src/data/competitors/oppo.js',
    'src/data/competitors/vivo.js',
    'src/data/competitors/microsoft_nokia.js',
    'src/data/competitors/honor.js',
    'src/data/competitors/oneplus.js',
    'src/data/competitors/nothing.js',
    'src/data/competitors/asus.js',
    'src/data/competitors/sony_mobile.js',
    'src/data/competitors/realme.js',
    'src/data/competitors/meizu.js',
    'src/data/competitors/lenovo.js',
    'src/data/competitors/tecno.js',
    'src/data/competitors/zte.js'
];
let txt = '';
for (const f of files) {
    try {
        await import('./' + f);
        txt += 'OK  ' + f + '\n';
    } catch (e) {
        txt += 'ERR ' + f + '\n';
        txt += '    -> ' + (e && e.message ? e.message : e) + '\n';
    }
    out.textContent = txt;
}
out.innerHTML = txt
    .replace(/^OK /gm, '<span class="ok">OK  </span>')
    .replace(/^ERR /gm, '<span class="bad">ERR </span>')
    .replace(/^    -> /gm, '<span class="bad">    -> </span>');
</script>
</body>
</html>
